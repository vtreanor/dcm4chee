#############################################################################
# This is branch pacs-v1.1
#############################################################################

services:

  ###########################################################################
  # TRAEFIK — Reverse proxy for HTTP + TCP (LDAP)
  ###########################################################################
  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    networks:
      - proxy

    command:
      # Logging + dashboard
      - "--log.level=DEBUG"
      - "--api.insecure=true"

      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # HTTP + HTTPS entrypoints
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.forwardedHeaders.insecure=true"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.forwardedHeaders.insecure=true"

      # Redirect all HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt (HTTP challenge)
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=admin@techirl.eu"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"

      # LDAP TCP passthrough entrypoints
      - "--entryPoints.ldap.address=:389"
      - "--entryPoints.ldaps.address=:636"

    ports:
      - "80:80"         # HTTP
      - "443:443"       # HTTPS
      - "8080:8080"     # Traefik dashboard
      - "389:389"       # LDAP (plain TCP)
      - "636:636"       # LDAPS (TLS)
      
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

  ###########################################################################
  # OHIF Viewer
  ###########################################################################
  ohif:
    image: nginx:alpine
    container_name: ohif
    networks:
      - proxy

    ports:
      - "8081:80"

    environment:
      PUBLIC_URL: "/"

    volumes:
      - /home/ubuntu/pacs/Viewers/platform/app/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    labels:
      - "traefik.enable=true"

      # - "traefik.http.routers.ohif.rule=Host(`ohif.techirl.eu`)"
      - "traefik.http.routers.ohif.rule=Host(`ohif.techirl.eu`) && (PathPrefix(`/`) || PathPrefix(`/callback`))"

      - "traefik.http.routers.ohif.entrypoints=websecure"
      - "traefik.http.routers.ohif.tls=true"
      - "traefik.http.routers.ohif.tls.certresolver=le"

      - "traefik.http.services.ohif.loadbalancer.server.port=80"

      - "traefik.http.middlewares.ohif-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ohif-headers.headers.customrequestheaders.X-Forwarded-Host=ohif.techirl.eu"
      - "traefik.http.middlewares.ohif-headers.headers.customrequestheaders.X-Forwarded-Port=443"

      - "traefik.http.middlewares.ohif-forward.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ohif-forward.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.ohif-forward.headers.customrequestheaders.X-Forwarded-Host=ohif.techirl.eu"


      - "traefik.http.routers.ohif.middlewares=ohif-headers,ohif-forward,keycloak-headers@docker"


  ###########################################################################
  # KEYCLOAK — Authentication server (OIDC)
  ###########################################################################
  keycloak:
    image: dcm4che/keycloak:26.0.6
    networks:
      - proxy

    environment:
      KC_DB: postgres 
      KC_DB_URL: jdbc:postgresql://db:5432/pacsdb 
      KC_DB_USERNAME: pacs 
      KC_DB_PASSWORD: pacs 
      KC_BOOTSTRAP_ADMIN_USERNAME: admin 
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin 
      KC_HOSTNAME: auth.techirl.eu 
      KC_HOSTNAME_URL: https://auth.techirl.eu 
      KC_PROXY_HEADERS: xforwarded 
      KC_PROXY: edge 
      KC_HOSTNAME_STRICT: "false" 
      KC_HOSTNAME_STRICT_HTTPS: "false" 
      KC_HTTP_ENABLED: "true" 
      KC_HTTP_PORT: "8080" 
      KC_HTTPS_ENABLED: "false"

    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.keycloak-secure.rule=Host(`auth.techirl.eu`)"
      - "traefik.http.routers.keycloak-secure.entrypoints=websecure"
      - "traefik.http.routers.keycloak-secure.tls=true"
      - "traefik.http.routers.keycloak-secure.tls.certresolver=le"
      - "traefik.http.routers.keycloak-secure.middlewares=keycloak-headers"

      # HTTP router
      - "traefik.http.routers.keycloak.rule=Host(`auth.techirl.eu`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.middlewares=redirect-to-https"

      # Middleware: The "X-Forwarded" engine
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Host=auth.techirl.eu"

      # Redirect and Backend
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.services.keycloak.loadbalancer.server.scheme=http"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  ###########################################################################
  # MARIADB — Optional Keycloak DB (unused if Keycloak uses Postgres)
  ###########################################################################
  mariadb:
    image: mariadb:10.11.4
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/mysql:/var/lib/mysql


  ###########################################################################
  # LDAP — DCM4CHEE directory service (users, roles, AE titles)
  ###########################################################################
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.10-34.2
    container_name: ldap
    networks:
      - proxy

    logging:
      driver: json-file
      options:
        max-size: "10m"

    environment:
      LDAP_BASE_DN: dc=dcm4che,dc=org
      LDAP_ADMIN_PASSWORD: secret
      STORAGE_DIR: /storage/fs1

    labels:
      - "traefik.enable=true"

      # Raw TCP passthrough for LDAP
      - "traefik.tcp.routers.ldap.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.ldap.tls=false"
      - "traefik.tcp.routers.ldap.entrypoints=ldap"
      - "traefik.tcp.services.ldap.loadbalancer.server.port=389"

    volumes:
      - /var/local/dcm4chee-arc/ldap:/var/lib/openldap/openldap-data
      - /var/local/dcm4chee-arc/slapd.d:/etc/openldap/slapd.d
      - pacs_ldap-config:/etc/openldap/slapd.d
      - pacs_ldap-data:/var/lib/openldap/openldap-data


  ###########################################################################
  # POSTGRES — Main PACS database
  ###########################################################################
  db:
    image: dcm4che/postgres-dcm4chee:17.4-34
    networks:
      - proxy

    logging:
      driver: json-file
      options:
        max-size: "10m"

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/db:/var/lib/postgresql/data


  ###########################################################################
  # DCM4CHEE-ARC — The PACS archive + UI2 (WildFly) ground one
  ###########################################################################
  arc:
    image: dcm4che/dcm4chee-arc-psql:5.34.2-secure
    networks:
      - proxy
    
    # extra_hosts:
    #   - "auth.techirl.eu:172.18.0.7"
    #   - "pacs-ui.techirl.eu:172.18.0.7"
    
    labels:
      - "traefik.enable=true"

      # -----------------------------
      # PACS UI (arc) Routers
      # -----------------------------
      - "traefik.http.routers.arc.rule=Host(`pacs-ui.techirl.eu`) && PathPrefix(`/dcm4chee-arc`)"
      - "traefik.http.routers.arc-secure.rule=Host(`pacs-ui.techirl.eu`) && PathPrefix(`/dcm4chee-arc`)"
      - "traefik.http.routers.arc-secure.entrypoints=websecure"
      - "traefik.http.routers.arc-secure.tls=true"
      - "traefik.http.routers.arc-secure.tls.certresolver=le"
      - "traefik.http.routers.arc-secure.service=arc"
      - "traefik.http.routers.arc-secure.priority=1000"

      # UI service
      - "traefik.http.services.arc.loadbalancer.server.port=8080"

      # -----------------------------
      # Authorization header passthrough
      # -----------------------------
      - "traefik.http.middlewares.pacs-headers.headers.customrequestheaders.Authorization=Authorization"

      # -----------------------------
      # DICOMweb Routers
      # -----------------------------
      - "traefik.http.routers.dicomweb.service=dicomweb"
      - "traefik.http.routers.dicomweb.middlewares=dicomweb-strip,dicomweb-add"
      - "traefik.http.routers.dicomweb.priority=500"

      - "traefik.http.routers.arc-secure.middlewares=forward-headers"

      - "traefik.http.routers.dicomweb-secure.middlewares=dicomweb-strip,dicomweb-add,forward-headers"


      - "traefik.http.routers.dicomweb-secure.rule=Host(`pacs-ui.techirl.eu`) && PathPrefix(`/dicom-web`)"
      - "traefik.http.routers.dicomweb-secure.entrypoints=websecure"
      - "traefik.http.routers.dicomweb-secure.tls=true"
      - "traefik.http.routers.dicomweb-secure.tls.certresolver=le"
      - "traefik.http.routers.dicomweb-secure.service=dicomweb"
      - "traefik.http.routers.dicomweb-secure.middlewares=dicomweb-strip,dicomweb-add"
      - "traefik.http.routers.dicomweb-secure.priority=500"

      # DICOMweb service
      - "traefik.http.services.dicomweb.loadbalancer.server.port=8080"

      # -----------------------------
      # DICOMweb Middlewares
      # -----------------------------
      - "traefik.http.middlewares.dicomweb-strip.stripprefix.prefixes=/dicom-web"
      - "traefik.http.middlewares.dicomweb-add.addprefix.prefix=/dcm4chee-arc/aets/DCM4CHEE/rs"

      - "traefik.http.middlewares.forward-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.forward-headers.headers.customrequestheaders.X-Forwarded-Host=pacs-ui.techirl.eu"
      - "traefik.http.middlewares.forward-headers.headers.customrequestheaders.X-Forwarded-Port=443"

    ports:
      - "8443:8443"     # WildFly HTTPS (internal)
      - "9990:9990"     # WildFly admin
      - "9993:9993"
      - "11112:11112"   # DICOM C-STORE SCP
      - "2762:2762"     # HL7
      # - "2575:2575"
      - "12575:12575"
      - "8082:8080"

    environment:
      
      
      ARCHIVE_DEVICE_HTTPS_SCHEME: https
      ARCHIVE_DEVICE_HTTPS_HOST: pacs-ui.techirl.eu
      # ARCHIVE_DEVICE_HTTPS_HOST: 0.0.0.0
      ARCHIVE_DEVICE_HTTPS_PORT: 443
      ARCHIVE_DEVICE_HTTP_PORT: 80
      ARCHIVE_DEVICE_WADO_URL: "https://pacs-ui.techirl.eu/dcm4chee-arc/aets/DCM4CHEE/rs"

      WADO_BASE_URL: https://pacs-ui.techirl.eu/dcm4chee-arc/aets/DCM4CHEE/rs

      QIDO_BASE_URL: https://pacs-ui.techirl.eu
      QIDO_BASE_PATH: /dcm4chee-arc/aets/DCM4CHEE/rs

      # Logging
      WILDFLY_LOGLEVEL: INFO
      WILDFLY_LOGLEVEL_ORG_KEYCLOAK: DEBUG
      WILDFLY_LOGLEVEL_ORG_DCM4CHE: DEBUG
      WILDFLY_LOGLEVEL_ORG_DCM4CHEE: DEBUG
      WILDFLY_LOGLEVEL_ORG_JBOSS_AS: DEBUG

      # DB
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs

      LDAP_UPDATE_CONFIG: true
      AUTH_SERVER_URL: https://auth.techirl.eu
      UI_AUTH_SERVER_URL: https://auth.techirl.eu
      KC_REALM: dcm4che
      PROXY_ADDRESS_FORWARDING: "true"
      HTTP_PROXY_ADDRESS_FORWARDING: "true"

      # Storage + startup dependencies
      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 db:5432 keycloak:8080

      WILDFLY_HTTPS_PORT: 8443
      WILDFLY_HTTPS_KEYSTORE: /opt/wildfly/standalone/configuration/keystores/cacerts.p12
      WILDFLY_HTTPS_KEYSTORE_PASSWORD: changeit

      DCM4CHEE_ARC_EXTENSIONS: "dcm4chee-arc-ui2,dcm4chee-arc-wado"


    depends_on:
      - ldap
      - keycloak
      - db

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/storage:/storage
      - arc_data:/data
      - ./keycloak.json:/opt/wildfly/standalone/configuration/dcm4chee-arc/keycloak.json:ro

      # Optional override (not needed now that OIDC is correct)
      - /var/local/dcm4chee-arc/re-brand:/opt/wildfly/re-brand:ro


  ###########################################################################
  # WHOAMI — Simple Traefik test endpoint
  ###########################################################################

  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      # -----------------------------
      # HTTP router (will be redirected to HTTPS)
      # -----------------------------
      - "traefik.http.routers.whoami.rule=Host(`whoami.techirl.eu`)"
      - "traefik.http.routers.whoami.entrypoints=web"

      # -----------------------------
      # HTTPS router (actual traffic)
      # -----------------------------
      - "traefik.http.routers.whoami-secure.rule=Host(`whoami.techirl.eu`)"
      - "traefik.http.routers.whoami-secure.entrypoints=websecure"
      - "traefik.http.routers.whoami-secure.tls=true"
      - "traefik.http.routers.whoami-secure.tls.certresolver=le"

      # -----------------------------
      # Backend service
      # -----------------------------
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

###########################################################################
# NETWORKS
###########################################################################
networks:
  proxy:
    name: proxy

volumes:
  pacs_ldap-config:
  pacs_ldap-data:
  arc_data:
