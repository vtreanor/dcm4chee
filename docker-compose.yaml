#############################################################################
# OVH PACS deployment — branch pacs-v05
#
# Fix history:
#   [FIX-1]  arc: REALM_NAME env var
#   [FIX-2]  arc: UI_AUTH_SERVER_URL added
#   [FIX-3]  arc: forward-headers middleware includes all three X-Forwarded headers
#   [FIX-4]  arc: CSS/image bind-mounts removed
#   [FIX-5]  arc: arc_data named volume replaced with bind-mount
#   [FIX-6]  arc: LDAP_UPDATE_CONFIG added
#   [FIX-7]  traefik: logging stanza added
#   [FIX-8]  whoami: unresolved ${whoami_ip} replaced with proper hostname
#   [FIX-9]  ldap: bind-mount / named-volume path conflict resolved
#   [FIX-10] arc: AUTH_SERVER_URL uses http://keycloak:8080 (internal DNS)
#   [FIX-11] arc: extra_hosts — pacs-ui.osirl.com → Docker gateway
#   [FIX-12] keycloak: KC_HOSTNAME as full https:// URL
#   [FIX-13] volumes: all named volumes converted to bind-mounts
#   [SEC-1]  All credentials moved to .env file
#   [SEC-2]  mariadb removed — unused, was exposing port 3306 with weak password
#   [SEC-3]  Traefik dashboard secured — api.insecure removed, dashboard
#             restricted to internal IPs via middleware
#   [SEC-4]  WildFly management ports 9990/9993 removed from host publishing
#   [SEC-5]  PostgreSQL port 5432 removed from host publishing
#   [SEC-6]  whoami restricted to internal source IPs only
#   [SEC-7]  Network segmentation — backend network added; db and ldap moved
#             off proxy network
#   [SEC-8]  Plain LDAP port 389 removed from Traefik entrypoints
#   [SEC-9]  Log levels set to INFO
#############################################################################

services:

  ###########################################################################
  # TRAEFIK — Reverse proxy
  ###########################################################################
  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    networks:
      - proxy

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    command:
      - "--log.level=INFO"
      - "--providers.docker.network=proxy"

      # [SEC-3] Dashboard enabled but protected — no api.insecure
      - "--api.dashboard=true"
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.forwardedHeaders.insecure=true"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.forwardedHeaders.insecure=true"

      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=admin@osirl.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"

      # [SEC-8] Plain LDAP entrypoint removed — LDAPS only
      - "--entryPoints.ldaps.address=:636"

    ports:
      - "80:80"
      - "443:443"
      # [SEC-3] 8080 removed — dashboard now via SSH tunnel on websecure
      - "636:636"

    # [SEC-3] Dashboard router defined via labels below
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.osirl.com`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-ipallow"
      # Restrict dashboard to your known source ranges
      - "traefik.http.middlewares.dashboard-ipallow.ipallowlist.sourcerange=137.43.136.0/23,86.46.174.0/24,137.43.50.0/24"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"


  ###########################################################################
  # OHIF Viewer
  ###########################################################################
  ohif:
    image: nginx:alpine
    container_name: ohif
    networks:
      - proxy

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    environment:
      PUBLIC_URL: "/"

    volumes:
      - /home/ubuntu/pacs/Viewers/platform/app/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.ohif.rule=Host(`ohif.osirl.com`) && (PathPrefix(`/`) || PathPrefix(`/callback`))"
      - "traefik.http.routers.ohif.entrypoints=websecure"
      - "traefik.http.routers.ohif.tls=true"
      - "traefik.http.routers.ohif.tls.certresolver=le"

      - "traefik.http.services.ohif.loadbalancer.server.port=80"

      - "traefik.http.middlewares.ohif-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ohif-headers.headers.customrequestheaders.X-Forwarded-Host=ohif.osirl.com"
      - "traefik.http.middlewares.ohif-headers.headers.customrequestheaders.X-Forwarded-Port=443"

      - "traefik.http.middlewares.ohif-forward.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ohif-forward.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.ohif-forward.headers.customrequestheaders.X-Forwarded-Host=ohif.osirl.com"

      - "traefik.http.routers.ohif.middlewares=ohif-headers,ohif-forward,keycloak-headers@docker"


  ###########################################################################
  # KEYCLOAK — Authentication server (OIDC)
  ###########################################################################
  keycloak:
    image: dcm4che/keycloak:26.0.6
    networks:
      - proxy
      - backend

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/pacsdb
      # [SEC-1] Credentials from .env
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_HOSTNAME: https://auth.osirl.com
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HTTPS_ENABLED: "false"

      # KC_IMPORT: /opt/keycloak/data/import/realm-export.json

    volumes:
      - ./realm-export-fixed.json:/opt/keycloak/data/import/realm-export.json:ro

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.keycloak-secure.rule=Host(`auth.osirl.com`)"
      - "traefik.http.routers.keycloak-secure.entrypoints=websecure"
      - "traefik.http.routers.keycloak-secure.tls=true"
      - "traefik.http.routers.keycloak-secure.tls.certresolver=le"
      - "traefik.http.routers.keycloak-secure.middlewares=keycloak-headers"

      - "traefik.http.routers.keycloak.rule=Host(`auth.osirl.com`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.middlewares=redirect-to-https"

      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Host=auth.osirl.com"

      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.services.keycloak.loadbalancer.server.scheme=http"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"


  ###########################################################################
  # LDAP — DCM4CHEE directory service
  # [SEC-7] On backend network only — not reachable from proxy network
  ###########################################################################
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.10-34.2
    container_name: ldap
    networks:
      - backend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      LDAP_BASE_DN: dc=dcm4che,dc=org
      # [SEC-1] Credentials from .env
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      STORAGE_DIR: /storage/fs1

    # [SEC-8] LDAP Traefik labels removed — no external exposure
    # arc connects directly via Docker DNS: ldap:389 on backend network

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/ldap:/var/lib/openldap/openldap-data
      - /var/local/dcm4chee-arc/slapd.d:/etc/openldap/slapd.d


  ###########################################################################
  # POSTGRES — Main PACS database
  # [SEC-5] Port 5432 not published to host
  # [SEC-7] On backend network only
  ###########################################################################
  db:
    image: dcm4che/postgres-dcm4chee:17.4-34
    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"

    # [SEC-5] No ports published — backend network only
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/db:/var/lib/postgresql/data


  ###########################################################################
  # DCM4CHEE-ARC — PACS archive + UI2 (WildFly)
  ###########################################################################
  arc:
    image: dcm4che/dcm4chee-arc-psql:5.34.2-secure
    networks:
      - proxy
      - backend

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    extra_hosts:
      - "pacs-ui.osirl.com:172.22.0.1"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.arc.service=arc"
      - "traefik.http.routers.arc.priority=1000"

      - "traefik.http.routers.arc-secure.rule=Host(`pacs-ui.osirl.com`) && PathPrefix(`/dcm4chee-arc`)"
      - "traefik.http.routers.arc-secure.entrypoints=websecure"
      - "traefik.http.routers.arc-secure.tls=true"
      - "traefik.http.routers.arc-secure.tls.certresolver=le"
      - "traefik.http.routers.arc-secure.service=arc"
      - "traefik.http.routers.arc-secure.priority=1000"
      - "traefik.http.routers.arc-secure.middlewares=forward-headers"

      - "traefik.http.services.arc.loadbalancer.server.port=8080"

      - "traefik.http.middlewares.pacs-headers.headers.customrequestheaders.Authorization=Authorization"

      - "traefik.http.routers.dicomweb.service=dicomweb"
      - "traefik.http.routers.dicomweb.middlewares=dicomweb-strip,dicomweb-add"
      - "traefik.http.routers.dicomweb.priority=500"

      - "traefik.http.routers.dicomweb-secure.rule=Host(`pacs-ui.osirl.com`) && PathPrefix(`/dicom-web`)"
      - "traefik.http.routers.dicomweb-secure.entrypoints=websecure"
      - "traefik.http.routers.dicomweb-secure.tls=true"
      - "traefik.http.routers.dicomweb-secure.tls.certresolver=le"
      - "traefik.http.routers.dicomweb-secure.service=dicomweb"
      - "traefik.http.routers.dicomweb-secure.middlewares=dicomweb-strip,dicomweb-add,forward-headers"
      - "traefik.http.routers.dicomweb-secure.priority=500"

      - "traefik.http.services.dicomweb.loadbalancer.server.port=8080"

      - "traefik.http.middlewares.dicomweb-strip.stripprefix.prefixes=/dicom-web"
      - "traefik.http.middlewares.dicomweb-add.addprefix.prefix=/dcm4chee-arc/aets/DCM4CHEE/rs"

      - "traefik.http.middlewares.forward-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.forward-headers.headers.customrequestheaders.X-Forwarded-Host=pacs-ui.osirl.com"
      - "traefik.http.middlewares.forward-headers.headers.customrequestheaders.X-Forwarded-Port=443"

    ports:
      - "8443:8443"
      # [SEC-4] 9990/9993 removed — access via SSH tunnel if needed
      # ssh -L 9990:localhost:9990 user@145.239.3.120
      - "11112:11112"
      - "2762:2762"
      # [SEC-4] 8082:8080 removed — vestigial debug port
      # [SEC-5] 12575 removed — vestigial

    environment:
      PROXY_ADDRESS_FORWARDING: "true"
      HTTP_PROXY_ADDRESS_FORWARDING: "true"

      ARCHIVE_DEVICE_HTTPS_SCHEME: https
      ARCHIVE_DEVICE_HTTPS_HOST: pacs-ui.osirl.com
      ARCHIVE_DEVICE_HTTPS_PORT: 443
      ARCHIVE_DEVICE_HTTP_PORT: 80
      ARCHIVE_DEVICE_WADO_URL: "https://pacs-ui.osirl.com/dcm4chee-arc/aets/DCM4CHEE/rs"

      WADO_BASE_URL: https://pacs-ui.osirl.com/dcm4chee-arc/aets/DCM4CHEE/rs
      QIDO_BASE_URL: https://pacs-ui.osirl.com
      QIDO_BASE_PATH: /dcm4chee-arc/aets/DCM4CHEE/rs

      # [SEC-9] Log levels set to INFO
      WILDFLY_LOGLEVEL: INFO
      WILDFLY_LOGLEVEL_ORG_KEYCLOAK: INFO
      WILDFLY_LOGLEVEL_ORG_DCM4CHE: INFO
      WILDFLY_LOGLEVEL_ORG_DCM4CHEE: INFO
      WILDFLY_LOGLEVEL_ORG_JBOSS_AS: INFO

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      AUTH_SERVER_URL: http://keycloak:8080
      UI_AUTH_SERVER_URL: https://auth.osirl.com
      REALM_NAME: dcm4che

      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 db:5432 keycloak:8080

      WILDFLY_HTTPS_PORT: 8443
      WILDFLY_HTTPS_KEYSTORE: /opt/wildfly/standalone/configuration/keystores/cacerts.p12
      WILDFLY_HTTPS_KEYSTORE_PASSWORD: ${WILDFLY_HTTPS_KEYSTORE_PASSWORD}

      DCM4CHEE_ARC_EXTENSIONS: "dcm4chee-arc-ui2,dcm4chee-arc-wado"
      LDAP_UPDATE_CONFIG: "true"
      LDAP_ROOTPASS: "secret"

    depends_on:
      - ldap
      - keycloak
      - db

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/storage:/storage
      - /var/local/dcm4chee-arc/arc-data:/data
      - /var/local/dcm4chee-arc/re-brand:/opt/wildfly/re-brand:ro


  ###########################################################################
  # WHOAMI — Traefik test endpoint
  # [SEC-6] Restricted to internal source IPs only
  ###########################################################################
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    networks:
      - proxy

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.whoami-secure.rule=Host(`whoami.osirl.com`)"
      - "traefik.http.routers.whoami-secure.entrypoints=websecure"
      - "traefik.http.routers.whoami-secure.tls=true"
      - "traefik.http.routers.whoami-secure.tls.certresolver=le"
      - "traefik.http.routers.whoami-secure.middlewares=whoami-ipallow"
      - "traefik.http.middlewares.whoami-ipallow.ipallowlist.sourcerange=137.43.136.0/23,86.46.174.0/24,137.43.50.0/24"

      - "traefik.http.services.whoami.loadbalancer.server.port=80"


###########################################################################
# NETWORKS
###########################################################################
networks:
  proxy:
    name: proxy
  backend:
    name: backend
    internal: true    # Docker enforces no external routing on this network