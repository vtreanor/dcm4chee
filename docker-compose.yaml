#############################################################################
# This is branch pacs-v1.1
#############################################################################

services:

  ###########################################################################
  # TRAEFIK — Reverse proxy for HTTP + TCP (LDAP)
  ###########################################################################
  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    networks:
      - proxy

    command:
      # Logging + dashboard
      - "--log.level=DEBUG"
      - "--api.insecure=true"

      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # HTTP + HTTPS entrypoints
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"

      # Redirect all HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt (HTTP challenge)
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=admin@osirl.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"

      # LDAP TCP passthrough entrypoints
      - "--entryPoints.ldap.address=:389"
      - "--entryPoints.ldaps.address=:636"

    ports:
      - "80:80"         # HTTP
      - "443:443"       # HTTPS
      - "8080:8080"     # Traefik dashboard
      - "389:389"       # LDAP (plain TCP)
      - "636:636"       # LDAPS (TLS)

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"



  ###########################################################################
  # KEYCLOAK — Authentication server (OIDC)
  ###########################################################################
  keycloak:
    image: dcm4che/keycloak:26.0.6
    networks:
      - proxy

    environment:
      KC_DB: postgres 
      KC_DB_URL: jdbc:postgresql://db:5432/pacsdb 
      KC_DB_USERNAME: pacs 
      KC_DB_PASSWORD: pacs 
      KC_BOOTSTRAP_ADMIN_USERNAME: admin 
      KC_BOOTSTRAP_ADMIN_PASSWORD: changeit 
      KC_HOSTNAME: auth.osirl.com 
      KC_HOSTNAME_URL: https://auth.osirl.com 
      KC_PROXY_HEADERS: xforwarded 
      KC_PROXY: edge 
      KC_HOSTNAME_STRICT: "false" 
      KC_HOSTNAME_STRICT_HTTPS: "false" 
      KC_HTTP_ENABLED: "true" 
      KC_HTTP_PORT: "8080" 
      KC_HTTPS_ENABLED: "false"


    labels:
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.keycloak-secure.rule=Host(`auth.osirl.com`)"
      - "traefik.http.routers.keycloak-secure.entrypoints=websecure"
      - "traefik.http.routers.keycloak-secure.tls=true"
      - "traefik.http.routers.keycloak-secure.tls.certresolver=le"
      - "traefik.http.routers.keycloak-secure.middlewares=keycloak-headers"

      # HTTP router (optional redirect)
      - "traefik.http.routers.keycloak.rule=Host(`auth.osirl.com`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.middlewares=redirect-to-https"

      # Forward HTTPS headers (Traefik 3.x does NOT do this automatically)
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Host=auth.osirl.com"

      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Backend service
      - "traefik.http.services.keycloak.loadbalancer.server.scheme=http"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"



  ###########################################################################
  # MARIADB — Optional Keycloak DB (unused if Keycloak uses Postgres)
  ###########################################################################
  mariadb:
    image: mariadb:10.11.4
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/mysql:/var/lib/mysql


  ###########################################################################
  # LDAP — DCM4CHEE directory service (users, roles, AE titles)
  ###########################################################################
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.10-34.2
    container_name: ldap
    networks:
      - proxy

    logging:
      driver: json-file
      options:
        max-size: "10m"

    environment:
      LDAP_BASE_DN: dc=dcm4che,dc=org
      LDAP_ADMIN_PASSWORD: secret
      STORAGE_DIR: /storage/fs1

    labels:
      - "traefik.enable=true"

      # Raw TCP passthrough for LDAP
      - "traefik.tcp.routers.ldap.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.ldap.tls=false"
      - "traefik.tcp.routers.ldap.entrypoints=ldap"
      - "traefik.tcp.services.ldap.loadbalancer.server.port=389"

    volumes:
      - /var/local/dcm4chee-arc/ldap:/var/lib/openldap/openldap-data
      - /var/local/dcm4chee-arc/slapd.d:/etc/openldap/slapd.d


  ###########################################################################
  # POSTGRES — Main PACS database
  ###########################################################################
  db:
    image: dcm4che/postgres-dcm4chee:17.4-34
    networks:
      - proxy

    logging:
      driver: json-file
      options:
        max-size: "10m"

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/db:/var/lib/postgresql/data


  ###########################################################################
  # DCM4CHEE-ARC — The PACS archive + UI2 (WildFly) ground one
  ###########################################################################
  arc:
    image: dcm4che/dcm4chee-arc-psql:5.34.2-secure
    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      # -----------------------------
      # PACS UI (arc) Routers
      # -----------------------------
      - "traefik.http.routers.arc.rule=Host(`pacs-ui.osirl.com`) && PathPrefix(`/dcm4chee-arc`)"
      - "traefik.http.routers.arc.entrypoints=web"
      - "traefik.http.routers.arc.service=arc"
      - "traefik.http.routers.arc.priority=1000"

      - "traefik.http.routers.arc-secure.rule=Host(`pacs-ui.osirl.com`) && PathPrefix(`/dcm4chee-arc`)"
      - "traefik.http.routers.arc-secure.entrypoints=websecure"
      - "traefik.http.routers.arc-secure.tls=true"
      - "traefik.http.routers.arc-secure.tls.certresolver=le"
      - "traefik.http.routers.arc-secure.service=arc"
      - "traefik.http.routers.arc-secure.priority=1000"

      # UI service
      - "traefik.http.services.arc.loadbalancer.server.port=8080"

      # -----------------------------
      # Authorization header passthrough
      # -----------------------------
      - "traefik.http.middlewares.pacs-headers.headers.customrequestheaders.Authorization=Authorization"

      # -----------------------------
      # DICOMweb Routers
      # -----------------------------
      - "traefik.http.routers.dicomweb.rule=Host(`pacs-ui.osirl.com`) && PathPrefix(`/dicom-web`)"
      - "traefik.http.routers.dicomweb.entrypoints=web"
      - "traefik.http.routers.dicomweb.service=dicomweb"
      - "traefik.http.routers.dicomweb.middlewares=dicomweb-strip,dicomweb-add"
      - "traefik.http.routers.dicomweb.priority=500"

      - "traefik.http.routers.dicomweb-secure.rule=Host(`pacs-ui.osirl.com`) && PathPrefix(`/dicom-web`)"
      - "traefik.http.routers.dicomweb-secure.entrypoints=websecure"
      - "traefik.http.routers.dicomweb-secure.tls=true"
      - "traefik.http.routers.dicomweb-secure.tls.certresolver=le"
      - "traefik.http.routers.dicomweb-secure.service=dicomweb"
      - "traefik.http.routers.dicomweb-secure.middlewares=dicomweb-strip,dicomweb-add"
      - "traefik.http.routers.dicomweb-secure.priority=500"

      # DICOMweb service
      - "traefik.http.services.dicomweb.loadbalancer.server.port=8080"

      # -----------------------------
      # DICOMweb Middlewares
      # -----------------------------
      - "traefik.http.middlewares.dicomweb-strip.stripprefix.prefixes=/dicom-web"
      - "traefik.http.middlewares.dicomweb-add.addprefix.prefix=/dcm4chee-arc/aets/DCM4CHEE/rs"




    ports:
      - "8443:8443"     # WildFly HTTPS (internal)
      - "9990:9990"     # WildFly admin
      - "9993:9993"
      - "11112:11112"   # DICOM C-STORE SCP
      - "2762:2762"     # HL7
      - "2575:2575"
      - "12575:12575"

    environment:
      # Logging
      WILDFLY_LOGLEVEL: INFO
      WILDFLY_LOGLEVEL_ORG_KEYCLOAK: DEBUG
      WILDFLY_LOGLEVEL_ORG_DCM4CHE: DEBUG
      WILDFLY_LOGLEVEL_ORG_DCM4CHEE: DEBUG
      WILDFLY_LOGLEVEL_ORG_JBOSS_AS: DEBUG

      # DB
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs

      # OIDC endpoints
      AUTH_SERVER_URL: https://auth.osirl.com
      UI_AUTH_SERVER_URL: https://auth.osirl.com


      # Storage + startup dependencies
      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 db:5432 keycloak:8080

      WILDFLY_HTTPS_PORT: 8443
      WILDFLY_HTTPS_KEYSTORE: /opt/wildfly/standalone/configuration/keystores/cacerts.p12
      WILDFLY_HTTPS_KEYSTORE_PASSWORD: changeit

      DCM4CHEE_ARC_EXTENSIONS: "dcm4chee-arc-ui2,dcm4chee-arc-wado"


    depends_on:
      - ldap
      - keycloak
      - db

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/wildfly:/opt/wildfly/standalone
      - /var/local/dcm4chee-arc/storage:/storage

      # Optional override (not needed now that OIDC is correct)
      - ./keycloak.json:/opt/wildfly/standalone/deployments/dcm4chee-arc-ui2.war/ui2/keycloak.json


  ###########################################################################
  # WHOAMI — Simple Traefik test endpoint
  ###########################################################################
  whoami:
    image: "traefik/whoami"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`${whoami_ip}`) && PathPrefix(`/whoami`)"
      - "traefik.http.routers.whoami.entrypoints=web"


###########################################################################
# NETWORKS
###########################################################################
networks:
  proxy:
    name: proxy
